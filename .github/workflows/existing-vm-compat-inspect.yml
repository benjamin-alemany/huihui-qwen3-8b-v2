name: Verify existing VM compatibility bytes without GPU or publication
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: existing-vm-compatibility-cpu-inspection
  cancel-in-progress: false
jobs:
  inspect:
    # Only an anonymous pull of the exact previously published image. No build,
    # registry writes, model imports, GPU, cloud credentials, cache or artifacts.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Require enough standard free ephemeral disk
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          python3 -I -B -c 'import shutil; assert shutil.disk_usage("/").free > 55*1024**3, "Stop without paid storage or runners"'
      - name: Pull the exact existing VM image without rebuilding
        run: |
          set -euo pipefail
          image='ghcr.io/benjamin-alemany/huihui-qwen3-8b-v2@sha256:86b61fca502d259910c36ec372c31adf59e0fb4495371904acc20f6bde535278'
          docker pull --platform linux/amd64 "$image"
          docker image inspect "$image" --format 'EXISTING_VM_IMAGE_UNCOMPRESSED_BYTES={{.Size}}'
      - name: Verify only compatibility libraries and remove the CPU container
        run: |
          set -euo pipefail
          python3 -I -B vm/compat_image.py --execute > "$RUNNER_TEMP/existing-vm-compatibility.json"
          python3 -I -B - <<'PY'
          import json,os
          with open(os.environ['RUNNER_TEMP']+'/existing-vm-compatibility.json') as source:
              receipt=json.load(source)
          assert receipt=={'version':1,'kind':'existing-image-cpu-compat-verified',
              'image':'ghcr.io/benjamin-alemany/huihui-qwen3-8b-v2@sha256:86b61fca502d259910c36ec372c31adf59e0fb4495371904acc20f6bde535278',
              'libraryPath':'/usr/local/cuda-13.0/compat:/usr/local/cuda-13.0/targets/x86_64-linux/lib',
              'modelLoaded':False,'cudaInitialized':False,'gpuUsed':False}
          print('EXISTING_VM_COMPATIBILITY_CPU_SOURCE='+os.environ['GITHUB_SHA'])
          print('EXISTING_VM_COMPATIBILITY_CPU_VERIFIED_MODEL_NOT_STARTED_NO_GPU')
          PY
