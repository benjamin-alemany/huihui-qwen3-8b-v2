name: Build inference-only private chat image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: qwen-chat-image-build
  cancel-in-progress: false
jobs:
  build:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify credential and short-session boot policy without a GPU
        run: |
          python3 -B chat/test_boot.py
          python3 -B -m unittest discover -s tests -v
          python3 -m py_compile chat/inference_only.py chat/model_boot.py
      - name: Create temporary builder
        run: docker buildx create --name qwen-chat-builder --driver docker-container --use
      - name: Authenticate only the registry push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish credential-free chat boot layer
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/huihui-qwen3-8b-v2"
          docker buildx build --platform linux/amd64 --provenance=false --push \
            --metadata-file /tmp/chat-image.json \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${image}:chat-${GITHUB_SHA}" -f chat/Dockerfile chat
          IMAGE="$image" python3 - <<'PY'
          import json,os
          digest=json.load(open('/tmp/chat-image.json'))['containerimage.digest']
          print('CHAT_IMAGE='+os.environ['IMAGE']+'@'+digest)
          print('SOURCE_SHA='+os.environ['GITHUB_SHA'])
          print('No model, GPU, cloud keys, artifacts or caches used.')
          PY
      - name: Remove temporary registry login
        if: always()
        run: docker logout ghcr.io
