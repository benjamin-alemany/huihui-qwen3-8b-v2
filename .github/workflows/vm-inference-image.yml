name: Reviewed VM inference overlay publication
on:
  workflow_call:
    inputs:
      cpu_run_id:
        required: true
        type: string
permissions:
  contents: read
  actions: read
  packages: write
jobs:
  build:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require successful free CPU checks on unchanged runtime source
        env:
          GH_TOKEN: ${{ github.token }}
          CPU_RUN_ID: ${{ inputs.cpu_run_id }}
        run: |
          set -euo pipefail
          [[ "$CPU_RUN_ID" =~ ^[0-9]{1,20}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CPU_RUN_ID" > "$RUNNER_TEMP/cpu-proof.json"
          python3 - <<'PY'
          import json,os,subprocess
          proof=json.load(open(os.environ['RUNNER_TEMP']+'/cpu-proof.json'))
          assert proof['repository']['full_name']==os.environ['GITHUB_REPOSITORY']
          assert proof['path']=='.github/workflows/chat-boundary-cpu.yml'
          assert proof['status']=='completed' and proof['conclusion']=='success'
          sha=proof['head_sha'];assert len(sha)==40 and all(c in '0123456789abcdef' for c in sha)
          subprocess.run(['git','merge-base','--is-ancestor',sha,'HEAD'],check=True)
          subprocess.run(['git','diff','--exit-code',sha,'HEAD','--','vm','chat/credential_boot.py','chat/credential_boundary.py','chat/offline_cache.py','chat/chat_server.py','start.py','.github/workflows/vm-boundary-cpu.yml'],check=True)
          PY
      - name: Require standard free ephemeral disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          python3 -c 'import shutil; assert shutil.disk_usage("/").free > 55*1024**3, "Stop without a paid runner or extra storage"'
      - name: Create temporary layer-reusing builder
        run: |
          printf '[worker.oci]\n  max-parallelism = 1\n' > "$RUNNER_TEMP/buildkitd.toml"
          docker buildx create --name unjailed-vm-builder --driver docker-container --buildkitd-config "$RUNNER_TEMP/buildkitd.toml" --use
      - name: Authenticate only the existing public package publication
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish reviewed overlay reusing exact existing model layers
        id: publish
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/huihui-qwen3-8b-v2"
          docker buildx build --platform linux/amd64 --provenance=false --network=none --push \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label 'work.unjailed.profile=vm-inference-v1' \
            --metadata-file "$RUNNER_TEMP/vm-image.json" \
            --tag "$image:vm-chat-$GITHUB_SHA" -f vm/Dockerfile.inference .
          python3 - <<'PY'
          import json,os,re
          digest=json.load(open(os.environ['RUNNER_TEMP']+'/vm-image.json'))['containerimage.digest']
          assert re.fullmatch('sha256:[0-9a-f]{64}',digest)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('digest='+digest+'\n')
          print('VM_CHAT_CANDIDATE_DIGEST='+digest)
          print('Candidate only: no VM, model initialization, deployment or release-pin change.')
          PY
      - name: Remove temporary registry login and builder
        if: always()
        run: |
          docker logout ghcr.io
          docker buildx rm unjailed-vm-builder || true
  verify-artifact:
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Require free disk for exact published artifact readback
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          python3 -c 'import shutil; assert shutil.disk_usage("/").free > 55*1024**3, "Stop without paid storage or runners"'
      - name: Check published code and unchanged offline cache without GPU or network
        env:
          CANDIDATE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/huihui-qwen3-8b-v2@$CANDIDATE_DIGEST"
          docker pull "$image"
          docker image inspect "$image" --format '{{json .Config.Entrypoint}}' | \
            python3 -c 'import json,sys; assert json.load(sys.stdin)==["python3","-I","-S","-B","/opt/qwen/credential_boot.py"]'
          python3 - <<'PY'
          import hashlib,json,os
          mapping={'vm/boot.py':'inference_only.py','vm/model_boot.py':'model_boot.py','vm/preflight.py':'preflight.py','vm/attestation.py':'attestation.py','vm/inference_policy.py':'inference_policy.py','chat/credential_boot.py':'credential_boot.py','chat/credential_boundary.py':'credential_boundary.py','chat/offline_cache.py':'offline_cache.py','chat/chat_server.py':'chat_server.py','start.py':'start.py'}
          with open(os.environ['RUNNER_TEMP']+'/code-hashes.json','w') as f:json.dump({target:hashlib.sha256(open(source,'rb').read()).hexdigest() for source,target in mapping.items()},f)
          PY
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --user 10001:10001 --cap-drop ALL --security-opt no-new-privileges --cpus 2 --memory 6g --pids-limit 128 \
            --mount "type=bind,source=$RUNNER_TEMP/code-hashes.json,target=/expected-code-hashes.json,readonly" \
            --entrypoint python3 "$image" -I -B -c '
          import hashlib,json,os,sys
          sys.path.insert(0,"/opt/qwen")
          for name,digest in json.load(open("/expected-code-hashes.json")).items():
              assert hashlib.sha256(open("/opt/qwen/"+name,"rb").read()).hexdigest()==digest
          import inference_policy,offline_cache,chat_server
          inference_policy.install()
          path=offline_cache.verify_cache()
          assert os.getuid()==10001 and not os.access(path,os.W_OK) and not os.access("/opt/qwen",os.W_OK)
          import torch,vllm
          assert torch.__version__.split("+")[0]=="2.13.0" and vllm.__version__=="0.32.0"
          assert chat_server.engine_options(path)["distributed_executor_backend"]=="uni"
          print("VM_ARTIFACT_CODE_CACHE_AND_LIBRARIES_VERIFIED_NO_MODEL_GPU_OR_TARGET_ACCEPTANCE")
          '
