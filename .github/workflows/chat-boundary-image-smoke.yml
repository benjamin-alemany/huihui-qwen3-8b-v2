name: Correct offline image directory permissions and verify
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: qwen-offline-directory-correction
  cancel-in-progress: false
jobs:
  build:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Reproduce refusal and verify the directory-only fix with dummy files
        run: |
          set -euo pipefail
          python3 -B chat/boundary_tests/permission_fixture.py "$RUNNER_TEMP/mode-fixture"
          docker build --platform linux/amd64 -t qwen-copy-mode-bad:fixture -f "$RUNNER_TEMP/mode-fixture/Dockerfile.bad" "$RUNNER_TEMP/mode-fixture"
          if docker run --rm --network none --read-only --user 10001:10001 --cap-drop ALL --memory 128m --pids-limit 32 --mount "type=bind,source=$RUNNER_TEMP/mode-fixture/verify.py,target=/verify.py,readonly" qwen-copy-mode-bad:fixture python3 -I -B /verify.py > "$RUNNER_TEMP/bad-mode.log" 2>&1; then
            echo 'Unexpected passing result before directory correction'; exit 1
          fi
          cat "$RUNNER_TEMP/bad-mode.log"
          python3 -c 'import os; s=open(os.environ["RUNNER_TEMP"]+"/bad-mode.log").read(); assert "PermissionError" in s and "/opt/qwen-model" in s, "Unexpected failure in the negative fixture"'
          docker build --platform linux/amd64 -t qwen-copy-mode-fixed:fixture -f "$RUNNER_TEMP/mode-fixture/Dockerfile.fixed" "$RUNNER_TEMP/mode-fixture"
          docker run --rm --network none --read-only --user 10001:10001 --cap-drop ALL --memory 128m --pids-limit 32 --mount "type=bind,source=$RUNNER_TEMP/mode-fixture/verify.py,target=/verify.py,readonly" qwen-copy-mode-fixed:fixture python3 -I -B /verify.py
      - name: Prepare directory-only layer without downloading weights again
        run: |
          mkdir -p "$RUNNER_TEMP/directory-layer/opt/qwen/model-notices" "$RUNNER_TEMP/directory-layer/opt/qwen-model"
          docker buildx create --name qwen-directory-builder --driver docker-container --use
      - name: Authenticate existing registry publication only
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish immutable directory correction only
        id: publish
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/huihui-qwen3-8b-v2"
          docker buildx build --platform linux/amd64 --provenance=false --push --metadata-file "$RUNNER_TEMP/fixed-image.json" --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "io.unjailed.runtime-source=e62ee0770dcdff8088c99fb835e2bee06b27d38c" --tag "$image:offline-chat-$GITHUB_SHA" -f chat/Dockerfile.permissions "$RUNNER_TEMP/directory-layer"
          python3 - <<'PYCODE'
          import json,os,re
          digest=json.load(open(os.environ['RUNNER_TEMP']+'/fixed-image.json'))['containerimage.digest']
          assert re.fullmatch('sha256:[0-9a-f]{64}',digest)
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:stream.write('digest='+digest+'\n')
          print('OFFLINE_CHAT_DIGEST='+digest)
          PYCODE
      - name: Remove temporary registry login and builder
        if: always()
        run: |
          docker logout ghcr.io
          docker buildx rm qwen-directory-builder || true
  verify-artifact:
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require free ephemeral disk for exact candidate readback
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          python3 -c 'import shutil; assert shutil.disk_usage("/").free > 52*1024**3, "Stop without a paid runner or storage"'
      - name: Verify exact published cache ownership hashes runtime imports and release settings
        env:
          CANDIDATE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/huihui-qwen3-8b-v2@$CANDIDATE_DIGEST"
          docker pull "$image"
          docker image inspect "$image" --format '{{json .Config.Entrypoint}}' | \
            python3 -c 'import json,sys; assert json.load(sys.stdin)==["python3","-I","-S","-B","/opt/qwen/credential_boot.py"]'
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --user 10001:10001 --cap-drop ALL --security-opt no-new-privileges --cpus 2 --memory 6g --pids-limit 128 \
            -e LD_PRELOAD=/opt/qwen/loopback_ifaddrs.so -e GLOO_SOCKET_IFNAME=lo -e VLLM_ENABLE_V1_MULTIPROCESSING=0 \
            --entrypoint python3 "$image" -I -B -c '
          import os,sys
          sys.path.insert(0,"/opt/qwen")
          import network_boundary,offline_cache,chat_server
          network_boundary.install()
          path=offline_cache.verify_cache()
          assert os.getuid()==10001 and not os.access(path,os.W_OK)
          assert not os.access("/opt/qwen",os.W_OK)
          import torch,vllm
          assert torch.__version__.split("+")[0]=="2.13.0" and vllm.__version__=="0.32.0"
          assert chat_server.engine_options(path)["distributed_executor_backend"]=="uni"
          print("Exact candidate offline-cache hashes/ownership, inherited policy, pinned runtime imports and chat-only configuration verified. No model/GPU initialized; Runpod validation remains pending.")
          '
