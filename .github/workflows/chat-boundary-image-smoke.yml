name: Chat published image credential boundary smoke
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qwen-chat-boundary-image-smoke
  cancel-in-progress: false
jobs:
  verify:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Prepare disposable standard runner disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          python3 -c "import shutil; assert shutil.disk_usage('/').free > 40*1024**3, 'Insufficient ephemeral disk; never use a paid larger runner'"
      - name: Exercise exact published image without network, model or GPU
        shell: bash
        run: |
          set -euo pipefail
          image='ghcr.io/benjamin-alemany/huihui-qwen3-8b-v2@sha256:f4fda4da17fe00a8188527d3a774dcc487529b63fe2e10359912d24d4ee83761'
          docker pull "$image"
          docker run --rm --network none --cpus 1 --memory 512m --pids-limit 64 \
            -e RUNPOD_API_KEY=DUMMY-NOT-A-REAL-PROVIDER-KEY \
            -e VLLM_API_KEY=DUMMY-INFERENCE-KEY-NOT-A-REAL-SECRET \
            "$image" --probe > /tmp/qwen-chat-boundary-receipt.txt
          python3 - <<'PY'
          import json
          text=open('/tmp/qwen-chat-boundary-receipt.txt').read()
          assert 'DUMMY-' not in text, 'Do not print even dummy key values'
          prefix='CHAT_CREDENTIAL_BOUNDARY '
          lines=[s[len(prefix):] for s in text.splitlines() if s.startswith(prefix)]
          assert len(lines)==1, 'Exactly one fixed probe receipt required'
          r=json.loads(lines[0])
          assert r['uid']==10001 and r['gid']==10001
          for key in ('credential_environment_clean','parent_process_data_denied','inherited_fds_closed','no_new_privileges','capabilities_empty','core_dumps_disabled','known_credential_paths_denied','dedicated_uid','privilege_regain_denied'):
              assert r[key] is True, key
          assert r['model_loaded'] is False and r['network_used'] is False and r['agent_tools'] is False
          print(prefix+json.dumps(r))
          print('Exact published image CPU probe passed; Runpod/GPU compatibility remains unverified.')
          PY
