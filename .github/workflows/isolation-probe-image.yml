name: Build model-free isolation probe image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: qwen-isolation-probe-build
  cancel-in-progress: false
jobs:
  build:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify portable broker gates
        run: /usr/bin/python3 -B -m unittest discover -s isolation/tests -v
      - name: Prepare disposable runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          /usr/bin/python3 -c "import shutil; assert shutil.disk_usage('/').free > 40*1024**3, 'Insufficient ephemeral disk; do not use a paid larger runner'"
      - name: Use temporary builder
        run: docker buildx create --name qwen-probe-builder --driver docker-container --use
      - name: Authenticate only the registry push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build credential-free probe without running a model
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/huihui-qwen3-8b-v2:isolation-probe-${GITHUB_SHA}"
          docker buildx build --platform linux/amd64 --provenance=false --push \
            --metadata-file /tmp/probe-image.json \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$image" -f isolation/runpod-probe/Dockerfile isolation
          /usr/bin/python3 - <<'PY'
          import json,os
          metadata=json.load(open('/tmp/probe-image.json'))
          digest=metadata['containerimage.digest']
          print('PROBE_IMAGE='+f"ghcr.io/{os.environ['GITHUB_REPOSITORY_OWNER'].lower()}/huihui-qwen3-8b-v2@{digest}")
          print('SOURCE_SHA='+os.environ['GITHUB_SHA'])
          print('No model, GPU, Runpod API, or agent tool executed.')
          PY
