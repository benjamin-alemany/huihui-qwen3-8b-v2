name: Inspect pinned CUDA compatibility artifact without GPU
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prepared-host-artifact-inspection
  cancel-in-progress: false
jobs:
  inspect:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Inspect the existing runtime base without model layers
        run: |
          set -euo pipefail
          image='vllm/vllm-openai@sha256:6ee133356d49ed24cee03dd0cda3d3980279a11c107ce3e752c89e76540f41c9'
          docker pull --platform linux/amd64 "$image"
          docker image inspect "$image" > "$RUNNER_TEMP/runtime-config.json"
          python3 - <<'PY'
          import json,os
          config=json.load(open(os.environ['RUNNER_TEMP']+'/runtime-config.json'))[0]['Config']
          env=dict(item.split('=',1) for item in config['Env'])
          print('PINNED_BASE_REQUIREMENTS='+json.dumps({key:env.get(key) for key in ['NVIDIA_REQUIRE_CUDA','NVIDIA_DRIVER_CAPABILITIES','CUDA_VERSION']},sort_keys=True))
          PY
          docker run --rm --network none --read-only --user 10001:10001 \
            --cap-drop ALL --security-opt no-new-privileges --cpus 2 --memory 1g --pids-limit 32 \
            --entrypoint python3 "$image" -I -B -c '
          import hashlib,json,os,pathlib,stat,subprocess
          root=pathlib.Path("/usr/local/cuda-13.0/compat")
          result={"version":1,"kind":"cuda-compat-inventory-proposal","path":str(root),"modelLoaded":False,"gpuInitialized":False,"approved":False,"files":[]}
          if root.exists():
              for p in sorted(root.iterdir()):
                  s=p.lstat()
                  if p.is_symlink():result["files"].append({"name":p.name,"symlink":os.readlink(p)})
                  elif stat.S_ISREG(s.st_mode):
                      assert s.st_uid==0 and not s.st_mode&0o022 and s.st_size<256*1024**2
                      result["files"].append({"name":p.name,"size":s.st_size,"sha256":hashlib.sha256(p.read_bytes()).hexdigest()})
                  else:raise ValueError("Unexpected compatibility entry")
              assert len(result["files"])<=32
          query=subprocess.run(["dpkg-query","--show","--showformat=${Package} ${Version} ${Architecture}","cuda-compat-13-0"],capture_output=True,text=True)
          if query.returncode==0:
              fields=query.stdout.split();assert len(fields)==3 and fields[0]=="cuda-compat-13-0" and fields[2]=="amd64"
              result["package"]={"name":fields[0],"version":fields[1],"architecture":fields[2]}
          print("CUDA_COMPAT_INVENTORY="+json.dumps(result,sort_keys=True,separators=(",",":")))
          '
      - name: Validate reviewed compatibility hashes with the runtime helper
        run: |
          set -euo pipefail
          image='vllm/vllm-openai@sha256:6ee133356d49ed24cee03dd0cda3d3980279a11c107ce3e752c89e76540f41c9'
          docker run --rm --network none --read-only --user 10001:10001 \
            --cap-drop ALL --security-opt no-new-privileges --cpus 2 --memory 1g --pids-limit 32 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/vm/cuda_compat.py,target=/opt/compat-review/cuda_compat.py,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/vm/cuda-compat.lock.json,target=/opt/compat-review/cuda-compat.lock.json,readonly" \
            --entrypoint python3 "$image" -I -S -B -c '
          import json,sys
          sys.path.insert(0,"/opt/compat-review")
          from cuda_compat import lock_digest,verify_compatibility
          with open("/opt/compat-review/cuda-compat.lock.json") as source:
              lock=json.load(source)
          assert lock["sourceImage"]=="vllm/vllm-openai@sha256:6ee133356d49ed24cee03dd0cda3d3980279a11c107ce3e752c89e76540f41c9"
          loader_path=verify_compatibility(lock)
          assert "torch" not in sys.modules and "vllm" not in sys.modules
          print("CUDA_COMPAT_REVIEWED_LIBRARY_PATH="+loader_path)
          print("CUDA_COMPAT_REVIEWED_LOCK_SHA256="+lock_digest(lock))
          print("CUDA_COMPAT_SOURCE_HASH_VALIDATION_PASSED_MODEL_NOT_STARTED_GPU_NOT_INITIALIZED")
          '
